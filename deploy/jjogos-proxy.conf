# Vai em /etc/nginx/snippets/jjogos-proxy.conf — compartilhado entre o bloco
# 80 e o 443 que o certbot cria, pra não ter duas cópias divergindo.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# WebSocket: o mesmo location serve HTTP e WS. $connection_upgrade vem do map
# em conf.d/upgrade.conf — com "Connection upgrade" fixo, request HTTP normal
# quebra.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# O relay de tela manda frames de 12KB continuamente e uma sala pode ficar
# horas aberta sem que o cliente envie nada. Timeout curto aqui = transmissão
# caindo sozinha, que é o sintoma mais difícil de diagnosticar depois.
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

# Buffer no meio de um stream só adiciona latência e come RAM.
proxy_buffering off;
proxy_request_buffering off;

# NÃO adicionar X-Frame-Options aqui: o DENY do proxy da Discloud foi
# exatamente o que impediu o iframe da Activity. O app já manda o
# Content-Security-Policy: frame-ancestors correto.
