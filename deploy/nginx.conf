# JJogos — proxy reverso. Copiar pra /etc/nginx/sites-available/jjogos e
# trocar DOMINIO_AQUI. O certbot reescreve este arquivo pra adicionar o TLS.

upstream jjogos {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_AQUI;

    # O certbot injeta o redirect pro 443 aqui depois de emitir o certificado.
    location / {
        proxy_pass http://jjogos;
        include /etc/nginx/snippets/jjogos-proxy.conf;
    }
}
